<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Show</title>
<style>
  /* Reset some default styles */
  * {
    box-sizing: border-box;
  }
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background-color: #f3f0eb; /* Background for the lower section */
  }
  /* Top orange bar */
  header {
    background-color: #ff6606; /* Bright orange */
    padding: 10px 0; /* Remove horizontal padding here */
    border-bottom: 1px solid #fff;
    display: flex;
    justify-content: center; /* center the container */
  }
  header .container {
    max-width: 1100px; /* same as search form */
    width: 100%;
    padding: 0 30px; /* same horizontal padding as search panel */
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  /* Left logo container */
  .logo {
    display: flex;
    align-items: center;
  }
  .logo img {
    height: 70px;
    margin-right: 10px;
  }
  .logo span {
    color: white;
    font-weight: bold;
    font-size: 18px;
    letter-spacing: 1.5px;
  }
  /* Right menu */
  nav {
    display: flex;
    align-items: center;
    gap: 20px;
    color: white;
    font-weight: 600;
    font-size: 14px;
  }
  nav a {
    color: white;
    text-decoration: none;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  nav a:hover {
    text-decoration: underline;
  }
  /* Icons placeholders: use emojis or unicode for simplicity */
  .icon-contato::before {
    content: "\1F551"; /* Clock emoji */
  }
  .icon-ajuda::before {
    content: "\2753"; /* Question mark emoji */
  }
  .icon-login::before {
    content: "\1F464"; /* Bust in silhouette */
  }
  .icon-carrinho::before {
    content: "\1F6D2"; /* Shopping cart */
  }
  /* Middle orange search panel */
  .search-panel {
    background-color: #ff9900;
    border-bottom: 1px solid #fff; /* botar no search_form dps do projeto atual*/
    padding: 20px 30px;
  }
  .search-form {
    max-width: 1100px;
    margin: 0 auto;
    display: flex;
    gap: 10px;
    align-items: center;
  }
  .location-input {
    flex: 3;
  }
  input[type="text"],
  input[type="date"],
  input[type="time"] {
    height: 40px;
    border: none;
    border-radius: 6px;
    padding: 8px 10px;
    font-size: 14px;
  }
  input[type="text"] {
    width: 100%;
  }
  /* Group date and time inputs */
  .date-group {
    display: flex;
    border-radius: 6px;
    overflow: hidden;
    border: 1px solid #ccc;
    background: #f5f3ee;
  }
  .date-group input[type="date"] {
    border: none;
    padding: 8px 10px;
    font-size: 14px;
    width: 120px;
  }
  .date-group input[type="time"] {
    border-left: 1px solid #ccc;
    border: none;
    padding: 8px 10px;
    font-size: 14px;
    width: 70px;
  }
  /* Search button */
  button {
    background-color: #ff6600;
    border: none;
    color: white;
    font-weight: 600;
    padding: 10px 15px;
    border-radius: 6px;
    font-size: 14px;
    cursor: pointer;
    transition: background-color 0.3s ease;
  }
  button:hover {
    background-color: #cc5200;
  }
  /* Carousel container */
  .carousel-container {
    background-color: #ff6600;
    position: relative;
    height: 350px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  /* Carousel arrows */
  .arrow-left,
  .arrow-right {
    position: absolute;
    top: 50%;
    background: rgba(255, 255, 255, 0.7);
    width: 30px;
    height: 30px;
    cursor: pointer;
    clip-path: polygon(70% 0, 0 50%, 70% 100%);
    transition: background 0.3s ease;
    user-select: none;
  }
  .arrow-left {
    left: 20px;
    transform: translateY(-50%);
    clip-path: polygon(0 50%, 70% 0, 70% 100%);
  }
  .arrow-right {
    right: 20px;
    transform: translateY(-50%) rotate(180deg);
    
  }
  .arrow-left:hover,
  .arrow-right:hover {
    background: rgba(255, 255, 255, 1);
  }
  /* Carousel dots */
  .dots {
    position: absolute;
    bottom: 15px;
    display: flex;
    gap: 8px;
  }
  .dot {
    background: white;
    border-radius: 50%;
    width: 12px;
    height: 12px;
    cursor: pointer;
    opacity: 0.7;
    transition: opacity 0.3s ease;
  }
  .dot.active,
  .dot:hover {
    opacity: 1;
  }
</style>
</head>
<body>

<header>
  <div class="container">
    <div class="logo">
      <img src="Isologo Show.png" alt="Show Logo" />
    </div>
    <nav>
      <a href="#" class="icon-contato">Contato</a>
      <a href="#" class="icon-ajuda">Ajuda</a>
      <span>|</span>
      <a href="#" class="icon-login">Login</a>
      <a href="#" class="icon-carrinho">Carrinho</a>
    </nav>
  </div>
</header>

<div class="search-panel">
  <form class="search-form" action="#">
    <div class="location-input">
      <input type="text" placeholder="Local de retirada" />
    </div>
    <div class="date-group" title="Data de retirada & Hora">
      <input type="date" aria-label="Data de retirada" />
      <input type="time" aria-label="Hora de retirada" />
    </div>
    <div class="date-group" title="Data de devolução & Hora">
      <input type="date" aria-label="Data de devolução" />
      <input type="time" aria-label="Hora de devolução" />
    </div>
    <button type="submit">Pesquisar</button>
  </form>
</div>

<div class="carousel-container">
  <!-- Left arrow -->
  <div class="arrow-left" role="button" aria-label="Previous"></div>
  <!-- Right arrow -->
  <div class="arrow-right" role="button" aria-label="Next"></div>
  <!-- Dots -->
  <div class="dots">
    <div class="dot active"></div>
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
  </div>
</div>

</body>
</html>
