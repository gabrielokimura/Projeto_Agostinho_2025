{% extends "base.html" %}

{% block title %}Login{% endblock %}


{% block conteudo_principal %}

<div class="painel_pesquisa">
    <div class="formulario_pesquisa">
        <form class="formulario_pesquisa" action="#">
            <div class="local_retirada">
                <input type="text" placeholder="local de retirada"/>
            </div>
            <div class="data" title="Data de retirada e horário">
                <input type="date" aria-label="Data de retirada"/>
                <input type="time" aria-label="Hora de devolução"/>
            </div>
            <button type="submit">Pesquisar</button>
        </form>
    </div>
</div>

{% endblock %}
