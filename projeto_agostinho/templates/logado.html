<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logado</title>
</head>
<body>
    <h1>Bem vindo, {{usuario["nome"]}}</h1>

    {% if carros_cadastrados != [] %}

    <h2>Frota de carros</h2>
    <ul>
    {% for carro in carros_cadastrados %}
        <li>{{ carro["marca"] }}</li>
    {% endfor %} 
    </ul>
    
    {% else %}

    <p>Não há carros cadastrados no momento</p>

    {% endif %}




    {% if usuario["admin"] %}
    <a href="/cadastro_carro">Cadastrar novos carros</a>
    {% endif %}
    <a href="/logout"> Logout</a>
</body>
</html>
